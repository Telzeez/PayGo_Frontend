name: Open Source Code Scanning

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read
  security-events: write

concurrency:
  group: code-scanning-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Semgrep Community Edition
        run: |
          python -m pip install semgrep
          semgrep scan \
            --config p/javascript \
            --config p/typescript \
            --config p/react \
            --config p/nextjs \
            --config p/xss \
            --config p/secrets \
            --exclude node_modules \
            --exclude .next \
            --exclude dist \
            --exclude build \
            --exclude coverage \
            --metrics=off \
            --sarif --output semgrep.sarif

      - name: Upload SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        if: hashFiles('semgrep.sarif') != ''
        with:
          sarif_file: semgrep.sarif
